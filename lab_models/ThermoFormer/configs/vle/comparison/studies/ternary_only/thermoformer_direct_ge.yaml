extends: ../../../../protocols/overall_ternary.yaml
name: c1_three_view_vanilla_direct_ge_ternary
data:
  pure_property_catalog: datasets/derived/thermodynamic_labels/external_psat_catalog.json
direct_ge_supervision:
  enabled: true
  pretrain_epochs: 20
  pretrain_learning_rate: 0.0002
  fugacity_epochs: 10
  excess_gibbs_weight: 1.0
  activity_coefficient_weight: 0.5
  vle_weight: 1.0
  fugacity_weight: 0.01
  minimum_fraction: 0.0001
  warmup_epochs: 2
physics_finetuning:
  enabled: true
  warmup_epochs: 2
  trainable_modules:
    - pair_potential
    - vapor_pressure
    - film
    - mixture_token
  pair_potential_lr: 0.00002
  vapor_pressure_lr: 0.00001
  film_lr: 0.000005
  mixture_token_lr: 0.000005
  teacher_forced_fugacity_weight: 0.01
runtime:
  output_dir: experiments/vle/generalization/training_records/comparisons/ternary_only/direct_ge
  results_file: experiments/vle/comparison/study_records/ternary_only/results.md
